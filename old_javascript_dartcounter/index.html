<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dart Counter Pro</title>
    <style>
        /* Basis-Design */
        body { font-family: -apple-system, sans-serif; background-color: #1c1c1e; color: white; margin: 0; padding: 15px; text-align: center; box-sizing: border-box; touch-action: manipulation; }
        h1, h2, h3 { color: #fff; margin-bottom: 10px; margin-top: 0; }
        .screen { display: none; } .active-screen { display: block; }
        
        /* Startbildschirm */
        .card { background-color: #2c2c2e; padding: 15px; border-radius: 16px; margin-bottom: 15px; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 12px; margin: 5px 0 15px 0; border-radius: 8px; border: none; background-color: #3a3a3c; color: white; font-size: 1.1em; box-sizing: border-box; }
        .radio-group { display: flex; justify-content: space-around; margin: 10px 0; background: #3a3a3c; padding: 10px; border-radius: 8px; }
        .radio-group label { display: flex; align-items: center; gap: 5px; font-size: 1em;}
        .input-row { display: flex; gap: 15px; }
        .input-row > div { flex: 1; text-align: left; }
        .input-row label { font-size: 0.9em; color: #8e8e93; margin-left: 5px;}

        /* Buttons */
        button { font-size: 1.1em; padding: 15px 10px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; transition: 0.1s; }
        button:active { transform: scale(0.95); opacity: 0.8; }
        .btn-success { background-color: #32d74b; width: 100%; }
        .btn-danger { background-color: #ff453a; }
        .btn-warning { background-color: #ff9f0a; color: black; width: 100%; margin-top: 10px; }
        .btn-secondary { background-color: #5e5ce6; }

        /* Scoreboard */
        .scoreboard { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px; }
        .player { padding: 10px; border-radius: 16px; flex: 1; background-color: #2c2c2e; opacity: 0.5; transition: all 0.3s ease; min-width: 100px; position: relative; }
        .active { border: 3px solid #32d74b; background-color: #3a3a3c; opacity: 1; transform: scale(1.02); }
        .player-name { font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score { font-size: 2.5em; font-weight: bold; margin: 5px 0; }
        .stats-preview { font-size: 0.75em; color: #8e8e93; display: flex; flex-direction: column; gap: 3px; }
        .badge-container { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .badge { background-color: #48484a; font-size: 0.75em; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
        .starter-dot { height: 10px; width: 10px; background-color: #ff9f0a; border-radius: 50%; display: inline-block; position: absolute; top: 10px; right: 10px; display: none; }
        .is-starter .starter-dot { display: inline-block; }

        /* DART EINGABE BEREICH */
        .dart-display { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .dart-box { width: 60px; height: 60px; background-color: #2c2c2e; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5em; font-weight: bold; border: 2px solid #48484a; }
        .round-total { font-size: 1.8em; font-weight: bold; margin-left: 10px; align-self: center; color: #32d74b; width: 70px;}
        
        .keypad { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .numpad-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .num-btn { background-color: #3a3a3c; font-size: 1.4em; padding: 15px 0; border-radius: 8px; }
        .modifier-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
        .mod-btn { background-color: #48484a; font-size: 1.1em; padding: 15px 0; }
        .mod-active-double { background-color: #ff9f0a !important; color: black; }
        .mod-active-triple { background-color: #ff453a !important; color: white; }

        /* Modals (Popups) */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background-color: #2c2c2e; padding: 20px; border-radius: 16px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; text-align: left; }
        .stat-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85em; }
        .stat-table th, .stat-table td { border-bottom: 1px solid #48484a; padding: 8px 2px; text-align: center; }
        .stat-table th { color: #8e8e93; font-weight: normal; }
        .stat-table td:first-child, .stat-table th:first-child { text-align: left; }
        
        .history-item { background: #3a3a3c; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active-screen">
        <h1>Dart Setup</h1>
        
        <div class="card">
            <input type="text" id="new-profile-name" placeholder="Neuen Spieler erstellen...">
            <button class="btn-secondary" style="width: 100%; margin-top: 5px;" onclick="createProfile()">Speichern</button>
        </div>

        <div class="card">
            <h2>Spieler</h2>
            <div class="radio-group" style="margin-bottom: 15px;">
                <label><input type="radio" name="playerCount" value="1" onchange="buildPlayerSelects()"> 1</label>
                <label><input type="radio" name="playerCount" value="2" checked onchange="buildPlayerSelects()"> 2</label>
                <label><input type="radio" name="playerCount" value="3" onchange="buildPlayerSelects()"> 3</label>
                <label><input type="radio" name="playerCount" value="4" onchange="buildPlayerSelects()"> 4</label>
            </div>
            <div id="player-selects-container"></div>
        </div>

        <div class="card">
            <h2>Modus</h2>
            <div class="input-row">
                <div><label>Sets</label><input type="number" id="sets-to-win" value="1" min="1" max="10"></div>
                <div><label>Legs</label><input type="number" id="legs-to-win" value="3" min="1" max="15"></div>
            </div>
            <div class="radio-group">
                <label><input type="radio" name="startScore" value="301"> 301</label>
                <label><input type="radio" name="startScore" value="501" checked> 501</label>
            </div>
            <div class="radio-group">
                <label><input type="radio" name="outMode" value="SO"> Single Out</label>
                <label><input type="radio" name="outMode" value="DO" checked> Double Out</label>
                <label><input type="radio" name="outMode" value="MO"> Master Out</label>
            </div>
            <button class="btn-success" onclick="startGame()" style="margin-top: 10px;">Spiel Starten</button>
            <button class="btn-secondary" onclick="showSavedMatches()" style="margin-top: 10px; background-color: #48484a;">Match Historie ansehen</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="scoreboard" id="scoreboard"></div>

        <div class="keypad">
            <div class="dart-display">
                <div class="dart-box" id="dart-1"></div>
                <div class="dart-box" id="dart-2"></div>
                <div class="dart-box" id="dart-3"></div>
                <div class="round-total" id="round-total">0</div>
            </div>

            <div class="modifier-grid">
                <button id="btn-double" class="mod-btn" onclick="toggleMultiplier(2)">Double</button>
                <button id="btn-triple" class="mod-btn" onclick="toggleMultiplier(3)">Triple</button>
                <button class="mod-btn" onclick="addDart(25)">Bull</button>
                <button class="mod-btn" onclick="addDart(0)">Miss</button>
            </div>

            <div class="numpad-grid" id="numpad"></div>

            <button class="btn-warning" onclick="undoSingleDart()">⟲ 1 Dart zurück</button>
            
            <button class="btn-secondary" style="margin-top: 10px; background-color: #48484a;" onclick="abortGame()">Spiel abbrechen</button>
        </div>
    </div>

    <div id="stats-modal" class="modal">
        <div class="modal-content">
            <h2 id="winner-title" style="color: #32d74b; text-align: center;">Spielende</h2>
            <div id="stats-content"></div>
            <button class="btn-success" style="margin-top: 20px;" onclick="closeStatsAndExit()">Zurück zum Menü</button>
        </div>
    </div>

    <div id="history-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: #fff; text-align: center;">Gespeicherte Matches</h2>
            <div id="history-content"></div>
            <button class="btn-success" style="margin-top: 20px;" onclick="document.getElementById('history-modal').style.display='none'">Schließen</button>
        </div>
    </div>

    <script>
        // --- INITIALISIERUNG ---
        const numpad = document.getElementById('numpad');
        for (let i = 1; i <= 20; i++) {
            numpad.innerHTML += `<button class="num-btn" onclick="addDart(${i})">${i}</button>`;
        }

        let profiles = JSON.parse(localStorage.getItem('dartProfiles')) || { "Gast 1": { wins: 0, matches: 0, dartsThrown: 0, pointsScored: 0, highestThrow: 0 }, "Gast 2": { wins: 0, matches: 0, dartsThrown: 0, pointsScored: 0, highestThrow: 0 } };
        let savedMatches = JSON.parse(localStorage.getItem('dartMatches')) || [];

        // Zentrales State-Objekt
        let state = {
            players: [], // Enthält nun auch matchFirst9Pts und matchFirst9Darts
            activePlayer: 0,
            startingPlayerOfLeg: 0,
            config: { startScore: 501, outMode: "DO", setsToWin: 1, legsToWin: 3 },
            currentRoundDarts: [],
            currentMultiplier: 1,
            isProcessing: false,
            timeoutId: null,
            history: [] // Speichert den kompletten State nach JEDEM Dart
        };

        function saveProfiles() { localStorage.setItem('dartProfiles', JSON.stringify(profiles)); }
        function saveMatches() { localStorage.setItem('dartMatches', JSON.stringify(savedMatches)); }

        function createProfile() {
            const name = document.getElementById('new-profile-name').value.trim();
            if (!name || profiles[name]) return alert("Ungültiger oder bestehender Name.");
            profiles[name] = { wins: 0, matches: 0, dartsThrown: 0, pointsScored: 0, highestThrow: 0 };
            saveProfiles(); buildPlayerSelects(); document.getElementById('new-profile-name').value = '';
        }

        function buildPlayerSelects() {
            const count = parseInt(document.querySelector('input[name="playerCount"]:checked').value);
            const container = document.getElementById('player-selects-container');
            container.innerHTML = '';
            let options = Object.keys(profiles).map(n => `<option value="${n}">${n}</option>`).join('');
            for(let i = 0; i < count; i++) {
                container.innerHTML += `<select id="player-select-${i}">${options}</select>`;
            }
            for(let i = 0; i < count; i++) {
                let sel = document.getElementById(`player-select-${i}`);
                if (sel.options.length > i) sel.selectedIndex = i;
            }
        }

        // --- SPIEL STARTEN ---
        function startGame() {
            const count = parseInt(document.querySelector('input[name="playerCount"]:checked').value);
            let chosenPlayers = [];
            for(let i = 0; i < count; i++) { chosenPlayers.push(document.getElementById(`player-select-${i}`).value); }
            if (new Set(chosenPlayers).size !== chosenPlayers.length) {
                if(!confirm("Doppelte Spieler gewählt. Starten?")) return;
            }

            state.config.startScore = parseInt(document.querySelector('input[name="startScore"]:checked').value);
            state.config.outMode = document.querySelector('input[name="outMode"]:checked').value;
            state.config.setsToWin = parseInt(document.getElementById('sets-to-win').value) || 1;
            state.config.legsToWin = parseInt(document.getElementById('legs-to-win').value) || 3;

            state.players = chosenPlayers.map(name => ({
                name: name, score: state.config.startScore, legs: 0, sets: 0,
                legPts: 0, legDarts: 0, matchPts: 0, matchDarts: 0, legHistory: [],
                matchFirst9Pts: 0, matchFirst9Darts: 0 // NEU: Für den 9-Dart Average
            }));
            state.activePlayer = 0; state.startingPlayerOfLeg = 0; state.currentRoundDarts = [];
            state.currentMultiplier = 1; state.isProcessing = false; state.timeoutId = null; state.history = [];

            buildScoreboardUI();
            document.getElementById('start-screen').classList.remove('active-screen');
            document.getElementById('game-screen').classList.add('active-screen');
            updateUI();
        }

        function buildScoreboardUI() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = '';
            state.players.forEach((p, i) => {
                sb.innerHTML += `
                <div id="p${i}-box" class="player">
                    <span class="starter-dot"></span>
                    <h3 class="player-name">${p.name}</h3>
                    <div class="badge-container">
                        <span class="badge">S: <span id="p${i}-sets">0</span></span>
                        <span class="badge" style="background:#5e5ce6">L: <span id="p${i}-legs">0</span></span>
                    </div>
                    <div id="p${i}-score" class="score">${state.config.startScore}</div>
                    <div class="stats-preview">
                        <span id="p${i}-leg-avg">Leg Avg: 0.0</span>
                        <span id="p${i}-match-avg">Match Avg: 0.0</span>
                    </div>
                </div>`;
            });
        }

        // --- EINGABE LOGIK ---
        function toggleMultiplier(mult) {
            if (state.isProcessing) return;
            state.currentMultiplier = state.currentMultiplier === mult ? 1 : mult;
            updateMultiplierUI();
        }

        function updateMultiplierUI() {
            document.getElementById('btn-double').classList.remove('mod-active-double');
            document.getElementById('btn-triple').classList.remove('mod-active-triple');
            if (state.currentMultiplier === 2) document.getElementById('btn-double').classList.add('mod-active-double');
            if (state.currentMultiplier === 3) document.getElementById('btn-triple').classList.add('mod-active-triple');
        }

        function saveStateToHistory() {
            // Speichert den exakten Zustand VOR dem geworfenen Dart
            let clone = JSON.parse(JSON.stringify(state));
            clone.history = []; // Array leeren, um Endlosschleifen zu verhindern
            state.history.push(clone);
        }

        function undoSingleDart() {
            if (state.history.length === 0) return;
            
            // Wenn die App gerade wartet, um den Spieler zu wechseln, Timer abbrechen!
            if (state.timeoutId) {
                clearTimeout(state.timeoutId);
                state.timeoutId = null;
            }
            
            // Den letzten Zustand aus dem Speicher holen
            let previousState = state.history.pop();
            let currentHistory = state.history; // Historie beibehalten
            
            // Spielstand komplett überschreiben
            state = previousState;
            state.history = currentHistory;
            state.isProcessing = false; // Sperre aufheben
            state.timeoutId = null;
            
            updateMultiplierUI();
            updateUI();
        }

        function addDart(baseValue) {
            if (state.isProcessing || state.currentRoundDarts.length >= 3) return;
            if (baseValue === 25 && state.currentMultiplier === 3) {
                alert("Triple Bull gibt es nicht!"); state.currentMultiplier = 1; updateMultiplierUI(); return;
            }

            saveStateToHistory(); // Zustand sichern für perfekten Undo

            let multString = state.currentMultiplier === 1 ? "" : (state.currentMultiplier === 2 ? "D" : "T");
            if (baseValue === 25) multString = state.currentMultiplier === 2 ? "DB" : "B";
            if (baseValue === 0) multString = "Miss";
            let displayString = baseValue === 0 ? "0" : `${multString}${baseValue === 25 && state.currentMultiplier === 1 ? "" : (baseValue === 25 ? "" : baseValue)}`;

            state.currentRoundDarts.push({
                base: baseValue, mult: baseValue === 0 ? 1 : state.currentMultiplier,
                value: baseValue * state.currentMultiplier, label: displayString
            });

            state.currentMultiplier = 1; updateMultiplierUI(); updateUI();
            checkEndOfRound();
        }

        function checkEndOfRound() {
            let roundTotal = state.currentRoundDarts.reduce((sum, dart) => sum + dart.value, 0);
            let p = state.players[state.activePlayer];
            let newScore = p.score - roundTotal;
            let lastDart = state.currentRoundDarts[state.currentRoundDarts.length - 1];
            
            let bust = false, isWin = false;

            if (newScore < 0) bust = true;
            if (newScore === 1 && (state.config.outMode === 'DO' || state.config.outMode === 'MO')) bust = true;
            if (newScore === 0) {
                if (state.config.outMode === 'DO' && lastDart.mult !== 2) bust = true;
                if (state.config.outMode === 'MO' && lastDart.mult !== 2 && lastDart.mult !== 3) bust = true;
                if (!bust) isWin = true;
            }

            if (bust || isWin || state.currentRoundDarts.length === 3) {
                state.isProcessing = true; 
                if (bust) {
                    document.getElementById('round-total').innerText = "BUST";
                    document.getElementById('round-total').style.color = "#ff453a";
                }
                
                // 800ms warten, dann auswerten. (Wird durch Undo abgebrochen, falls nötig)
                state.timeoutId = setTimeout(() => { processRoundEnd(bust, isWin, roundTotal); }, 800);
            }
        }

        function processRoundEnd(bust, isWin, roundTotal) {
            saveStateToHistory(); // Auch den Switch-Moment sichern
            
            let p = state.players[state.activePlayer];
            let dartsThrown = state.currentRoundDarts.length;
            
            // --- FIRST 9 AVERAGE LOGIK ---
            let startDartCount = p.legDarts; // Wie viele Darts hatte er VOR dieser Aufnahme?
            for (let i = 0; i < dartsThrown; i++) {
                if (startDartCount + i < 9) { // Zählt nur für Dart 1 bis 9 im Leg
                    p.matchFirst9Darts += 1;
                    if (!bust) {
                        p.matchFirst9Pts += state.currentRoundDarts[i].value;
                    }
                }
            }

            p.legDarts += dartsThrown;
            p.matchDarts += dartsThrown;

            if (!bust) {
                p.score -= roundTotal;
                p.legPts += roundTotal;
                p.matchPts += roundTotal;
                if (roundTotal > profiles[p.name].highestThrow) profiles[p.name].highestThrow = roundTotal;
            }

            if (isWin) {
                handleLegWin(state.activePlayer);
            } else {
                state.activePlayer = (state.activePlayer + 1) % state.players.length;
                state.currentRoundDarts = [];
                state.isProcessing = false;
                state.timeoutId = null;
                updateUI();
            }
        }

        // --- LEG / SET LOGIK ---
        function handleLegWin(winnerIndex) {
            let winner = state.players[winnerIndex];
            winner.legs += 1;

            state.players.forEach(p => {
                let legAvg = p.legDarts > 0 ? ((p.legPts / p.legDarts) * 3).toFixed(1) : "0.0";
                p.legHistory.push(legAvg); 
                p.legPts = 0; p.legDarts = 0; p.score = state.config.startScore; 
            });

            if (winner.legs >= state.config.legsToWin) {
                winner.sets += 1;
                state.players.forEach(p => p.legs = 0); 
                
                if (winner.sets >= state.config.setsToWin) {
                    showMatchStats(winnerIndex);
                    return; 
                }
            }

            state.startingPlayerOfLeg = (state.startingPlayerOfLeg + 1) % state.players.length;
            state.activePlayer = state.startingPlayerOfLeg;
            state.currentRoundDarts = [];
            state.isProcessing = false; state.timeoutId = null;
            updateUI();
        }

        // --- STATISTIKEN & HISTORIE ---
        function showMatchStats(winnerIndex) {
            let winnerName = state.players[winnerIndex].name;
            document.getElementById('winner-title').innerText = `🏆 ${winnerName} gewinnt das Match!`;

            // Profil-Updates
            state.players.forEach((p, i) => {
                if (i === winnerIndex) profiles[p.name].wins += 1;
                profiles[p.name].matches += 1;
                profiles[p.name].dartsThrown += p.matchDarts;
                profiles[p.name].pointsScored += p.matchPts;
            });
            saveProfiles();

            // Match speichern
            let matchData = {
                date: new Date().toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }),
                winner: winnerName,
                players: state.players.map(p => ({
                    name: p.name, sets: p.sets, legs: p.legs,
                    avg: p.matchDarts > 0 ? ((p.matchPts / p.matchDarts) * 3).toFixed(1) : "0.0",
                    first9: p.matchFirst9Darts > 0 ? ((p.matchFirst9Pts / p.matchFirst9Darts) * 3).toFixed(1) : "0.0"
                }))
            };
            savedMatches.unshift(matchData);
            saveMatches();

            // Tabelle generieren
            let html = `<table class="stat-table">
                            <tr><th>Spieler</th><th>Match Avg</th><th>First 9</th><th>S</th><th>L</th></tr>`;
            
            state.players.forEach((p, i) => {
                html += `<tr>
                            <td><b>${p.name}</b></td>
                            <td style="color:#32d74b; font-weight:bold;">${matchData.players[i].avg}</td>
                            <td style="color:#ff9f0a;">${matchData.players[i].first9}</td>
                            <td>${p.sets}</td><td>${p.legs}</td>
                         </tr>`;
            });
            html += `</table><h3 style="margin-top:15px; font-size:1em; color:#8e8e93;">Averages pro Leg</h3>`;
            
            state.players.forEach(p => {
                if(p.legHistory.length > 0) {
                    html += `<div style="margin-bottom: 5px;"><b>${p.name}:</b> <span style="font-size:0.9em; color:#bbb;">${p.legHistory.join(' | ')}</span></div>`;
                }
            });

            document.getElementById('stats-content').innerHTML = html;
            document.getElementById('stats-modal').style.display = 'flex';
        }

        function showSavedMatches() {
            let html = '';
            if(savedMatches.length === 0) {
                html = "<p>Noch keine Matches gespeichert.</p>";
            } else {
                savedMatches.forEach(m => {
                    html += `<div class="history-item">
                                <b style="color:#32d74b;">Sieger: ${m.winner}</b> <span style="float:right; color:#8e8e93; font-size:0.8em;">${m.date}</span>
                                <hr style="border:0.5px solid #48484a; margin: 5px 0;">
                                <table style="width:100%; font-size:0.9em;">`;
                    m.players.forEach(p => {
                        html += `<tr><td>${p.name}</td><td>${p.sets}:${p.legs}</td><td>Avg: ${p.avg}</td><td>F9: ${p.first9}</td></tr>`;
                    });
                    html += `</table></div>`;
                });
            }
            document.getElementById('history-content').innerHTML = html;
            document.getElementById('history-modal').style.display = 'flex';
        }

        function closeStatsAndExit() {
            document.getElementById('stats-modal').style.display = 'none';
            abortGame();
        }

        function abortGame() {
            document.getElementById('game-screen').classList.remove('active-screen');
            document.getElementById('start-screen').classList.add('active-screen');
        }

        // --- UI UPDATE ---
        function updateUI() {
            state.players.forEach((p, i) => {
                document.getElementById(`p${i}-score`).innerText = p.score;
                document.getElementById(`p${i}-sets`).innerText = p.sets;
                document.getElementById(`p${i}-legs`).innerText = p.legs;
                
                let legAvg = p.legDarts > 0 ? ((p.legPts / p.legDarts) * 3).toFixed(1) : "0.0";
                let matchAvg = p.matchDarts > 0 ? ((p.matchPts / p.matchDarts) * 3).toFixed(1) : "0.0";
                document.getElementById(`p${i}-leg-avg`).innerText = `Leg Avg: ${legAvg}`;
                document.getElementById(`p${i}-match-avg`).innerText = `Match Avg: ${matchAvg}`;

                let box = document.getElementById(`p${i}-box`);
                if (i === state.activePlayer) box.classList.add('active');
                else box.classList.remove('active');

                if (i === state.startingPlayerOfLeg) box.classList.add('is-starter');
                else box.classList.remove('is-starter');
            });

            for(let i=1; i<=3; i++) {
                let box = document.getElementById(`dart-${i}`);
                if (state.currentRoundDarts[i-1]) {
                    box.innerText = state.currentRoundDarts[i-1].label;
                    box.style.borderColor = state.currentRoundDarts[i-1].mult === 2 ? '#ff9f0a' : (state.currentRoundDarts[i-1].mult === 3 ? '#ff453a' : '#48484a');
                } else {
                    box.innerText = ""; box.style.borderColor = '#48484a';
                }
            }
            
            let totalLabel = document.getElementById('round-total');
            totalLabel.style.color = "#32d74b"; 
            totalLabel.innerText = state.currentRoundDarts.reduce((sum, dart) => sum + dart.value, 0);
        }

        buildPlayerSelects();
    </script>
</body>
</html>
