name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Typecheck (TypeScript)
        run: npm run typecheck

      - name: 🧹 Linting (ESLint)
        run: npm run lint

      - name: 🧪 Unit & Component Tests (Vitest TDD)
        run: npm run test:coverage

      - name: 🏗️ Production Build (Vite & PWA)
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7

      - name: 🚀 Deploy to Netlify (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "Deploying to Netlify via Netlify CLI..."
            npx netlify-cli deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
          else
            echo "Netlify Secrets (NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID) not configured in GitHub Secrets."
            echo "If using Netlify Git Integration, Netlify automatically deploys on push via netlify.toml."
          fi

